{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password | Fitverse AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Inter:wght@300..600&display=swap">
  <link rel="stylesheet" href="{% static 'assets/styles.css' %}?v=10">
  <link rel="stylesheet" href="{% static 'assets/theme.css' %}?v=11">
</head>
<body>
  <main class="auth-layout">
    <section class="auth-visual">
      <img src="https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=900&q=85" alt="Fashion editorial">
    </section>
    <section class="auth-content">
      <form class="auth-form" method="POST" action="{% url 'forgot_password' %}">
        {% csrf_token %}
        <a class="logo" href="{% url 'home' %}">Fitverse<span> AI</span></a>
        <h1>Reset password</h1>
        <p>Enter your email and we'll send you instructions to reset your password.</p>

        {% if success %}
          <div class="notice" style="background:#def7ec;border-color:#31c48d;color:#03543f;">
            {{ success }}
          </div>
        {% endif %}

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>

        <button class="full" type="submit">Send reset link</button>
        <p style="text-align:center;margin-top:25px;font-size:13px">
          Remember your password? <a href="{% url 'login' %}" style="color:var(--plum);font-weight:700">Back to log in</a>
        </p>
      </form>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{% static 'assets/app.js' %}"></script>
</body>
</html>
