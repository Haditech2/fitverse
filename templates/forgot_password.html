{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#044625">
  <title>Reset password | Fitverse AI</title>
  <link rel="icon" href="{% static 'assets/brand/fitverse-mark.webp' %}" type="image/webp">
  <link rel="stylesheet" href="{% static 'assets/styles.css' %}?v=10">
  <link rel="stylesheet" href="{% static 'assets/vendor/scrolljs.css' %}?v=2.0.1">
  <link rel="stylesheet" href="{% static 'assets/experience.css' %}?v=13">
</head>
<body class="page-forgot-password">
  <a class="skip-link" href="#top">Skip to content</a>
  {% include "includes/brand_loader.html" %}
  <main class="auth-layout" id="top">
    <section class="auth-visual">
      <img src="{% static 'assets/looks/set-mudcloth-720.webp' %}" width="720" height="900" loading="lazy" alt="Occasion fashion editorial">
    </section>
    <section class="auth-content">
      <form class="auth-form" method="POST" action="{% url 'forgot_password' %}">
        {% csrf_token %}
        <a class="logo" href="{% url 'home' %}"><img class="brand-wordmark" src="{% static 'assets/brand/fitverse-wordmark-320.webp' %}" width="320" height="80" alt="FitVerse AI"></a>
        <h1>Reset password</h1>
        <p>Enter your email and we'll send you instructions to reset your password.</p>

        {% if success %}
          <div class="notice" style="background:#def7ec;border-color:#31c48d;color:#03543f;">
            {{ success }}
          </div>
        {% endif %}

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>

        <button class="full" type="submit">Send reset link</button>
        <p style="text-align:center;margin-top:25px;font-size:13px">
          Remember your password? <a href="{% url 'login' %}" style="color:var(--plum);font-weight:700">Back to log in</a>
        </p>
      </form>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="{% static 'assets/vendor/scroll.umd.js' %}?v=2.0.1"></script>
  <script src="{% static 'assets/app.js' %}?v=21"></script>
  <script src="{% static 'assets/scroll.js' %}?v=5"></script>
</body>
</html>
